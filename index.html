
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <title>DG Food | Cardápio Digital</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">DG <span>FOOD</span></div>
    <button class="cart-button" onclick="openCart()">
      🛒 Carrinho (<span id="cart-count">0</span>)
    </button>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Seu pedido.<br><span>Seu momento.</span></h1>
        <p>Peça seus favoritos sem sair de casa.</p>
        <button class="add-button"
          onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">
          Ver cardápio
        </button>
      </div>
    </section>

    <section id="menu">
      <h2 class="section-title">O que você deseja hoje?</h2>

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar produto..."
      >

      <h2 class="section-title">Categorias</h2>

      <div class="categories">
        <button class="category active" data-category="todos">Todos</button>
        <button class="category" data-category="hamburgueres">🍔 Hambúrgueres</button>
        <button class="category" data-category="pizzas">🍕 Pizzas</button>
        <button class="category" data-category="bebidas">🥤 Bebidas</button>
      </div>

      <h2 class="section-title">Mais pedidos</h2>
      <div id="products" class="products"></div>
    </section>
  </main>

  <footer>
    DG FOOD — Cardápio digital demonstrativo
  </footer>

  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Seu carrinho</h2>
        <button class="close" onclick="closeCart()">×</button>
      </div>

      <div id="cart-items"></div>

      <div class="total">
        Total: <span id="cart-total">R$ 0,00</span>
      </div>

      <button class="whatsapp" onclick="sendOrder()">
        Finalizar pelo WhatsApp
      </button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
